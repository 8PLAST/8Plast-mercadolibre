name: Cloud tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest test_stock_objectives test_marketplace_analytics test_product_planning test_cloud_runtime test_stock test_ml_tokens test_assistant_center test_assistant_automation webhook_server.test_webhook -v
      - run: python tools/smoke_cloud.py
