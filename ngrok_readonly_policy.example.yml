on_http_request:
  - actions:
      - type: oauth
        config:
          provider: google
  - expressions:
      - "!(actions.ngrok.oauth.identity.email in ['REEMPLAZAR_CON_CORREO_AUTORIZADO'])"
    actions:
      - type: deny
  - expressions:
      - "req.method != 'GET' && req.method != 'HEAD'"
    actions:
      - type: custom-response
        config:
          status_code: 405
          body: "Portal de solo lectura"
on_http_response:
  - actions:
      - type: compress-response
        config:
          algorithms: [gzip, br]
